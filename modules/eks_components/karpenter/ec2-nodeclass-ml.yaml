apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ml
spec:
  role: __KARPENTER_NODE_ROLE_NAME__
  amiFamily: AL2023
  amiSelectorTerms:
    - name: amazon-eks-node-al2023-x86_64-nvidia-*
      owner: amazon
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 210Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: __CLUSTER_NAME__
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: __CLUSTER_NAME__
  tags:
    karpenter.sh/discovery: __CLUSTER_NAME__
    workload: ml
