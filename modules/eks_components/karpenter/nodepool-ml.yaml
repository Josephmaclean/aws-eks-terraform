apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ml
spec:
  template:
    metadata:
      labels:
        workload: ml
        gpu: "true"
    spec:
      taints:
        - key: workload
          value: ml
          effect: NoSchedule
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ml
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g5.xlarge", "g5.2xlarge", "g6.xlarge", "g6.2xlarge"]
  limits:
    nvidia.com/gpu: "4"
    cpu: "64"
    memory: 256Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
