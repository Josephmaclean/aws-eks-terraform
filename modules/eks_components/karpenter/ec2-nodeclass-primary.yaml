apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: primary
spec:
  role: __KARPENTER_NODE_ROLE_NAME__
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: __CLUSTER_NAME__
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: __CLUSTER_NAME__
  tags:
    karpenter.sh/discovery: __CLUSTER_NAME__
    workload: primary
