apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: ml
spec:
  role: private-eks-karpenter-node-role
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: private-eks
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: private-eks
  tags:
    karpenter.sh/discovery: private-eks
    workload: ml
